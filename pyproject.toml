[project]
name = "zora-assistant"
version = "0.1.0"
description = "Zora: assistente pessoal de voz integrada ao OpenCode e a um Second Brain em Markdown."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Talita" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "rich>=13.7,<16",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "sounddevice>=0.4.6,<1",
  "faster-whisper>=1.0,<2",
  "edge-tts>=6.1,<8",
  "astronomy-engine>=2.1,<3",
  "textual>=0.60,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
  "mypy>=1.10,<3",
]
browser = [
  "playwright>=1.40,<2",
]

[project.scripts]
zora = "zora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["zora"]
branch = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = ["zora"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
  "ASYNC109", # timeout e repassado ao httpx, nao e um cancelamento manual
  "ASYNC220", # subprocess para iniciar o servidor OpenCode e intencional
  "ASYNC240", # operacoes locais de pathlib sao triviais neste CLI
  "E501",     # largura tratada pelo formatador
]
