name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install "ruff>=0.15,<1"
      - name: Lint
        run: ruff check zora tests

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar PortAudio
        run: brew install portaudio
      - name: Criar ambiente e instalar dependencias
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Testes
        run: .venv/bin/python -m pytest -q
